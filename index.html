<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patanan — Technology Universe</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ===== HOME VIEW ===== -->
<div id="home-view">
  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="#" onclick="return false;">
        <div class="logo-icon">P</div>
        <div><span class="logo-text">Patanan</span><span class="logo-sub">Technology Universe</span></div>
      </a>
      <div class="search-wrapper">
        <div class="search-bar">
          <span class="search-icon">🔍</span>
          <input type="search" id="search-input" placeholder="ค้นหาเทคโนโลยี... (กด Enter)" autocomplete="off" spellcheck="false">
          <button id="search-clear" aria-label="ล้างการค้นหา">✕</button>
        </div>
        <div id="search-suggestions" class="hidden"></div>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="hero-eyebrow">ฐานข้อมูลเทคโนโลยีโลก</div>
    <h1>สำรวจเทคโนโลยี<br>ที่เปลี่ยนโลก</h1>
    <p>รวบรวมข้อมูลเทคโนโลยีจากทั่วโลก พร้อมโมเดล 3D interactive เพื่อความเข้าใจที่ลึกซึ้ง</p>
  </section>

  <div id="main-feed">
    <div class="section-header">
      <span class="section-title">แนะนำสำหรับคุณ</span>
      <div class="section-line"></div>
    </div>
    <div id="feed-grid"></div>
    <div id="feed-sentinel"></div>
    <div id="load-indicator" class="hidden"><span></span><span></span><span></span></div>
  </div>

  <div id="search-feed-wrap" class="hidden">
    <p class="search-results-header">ผลการค้นหา</p>
    <div id="search-results-feed"></div>
  </div>
</div>


<!-- ===== ARTICLE VIEW ===== -->
<div id="article-view" class="hidden">
  <div class="article-header">
    <div class="article-header-inner">
      <button id="back-btn">← กลับ</button>
      <div class="article-title-wrap"><h2 id="article-title"></h2></div>
    </div>
  </div>

  <div class="article-body">
    <div class="article-hero-info">
      <h1 id="article-title-main"></h1>
      <p id="article-title-th"></p>
      <div class="article-meta">
        <span class="badge" id="article-category"></span>
        <span id="article-year"></span>
      </div>
      <div id="article-tags"></div>
    </div>

    <!-- 3D MODEL AREA -->
    <div id="model-wrapper">
      <canvas id="model-canvas"></canvas>

      <!-- Model Controls -->
      <div class="model-controls">
        <button id="btn-rotate" class="ctrl-btn active" title="หยุดหมุน">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
          </svg>
        </button>
        <button id="btn-reset" class="ctrl-btn" title="รีเซ็ตกล้อง">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
        </button>
        <div style="position:relative">
          <button id="btn-parts" class="ctrl-btn" title="ดูชิ้นส่วนทั้งหมด">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
            </svg>
          </button>
          <div id="parts-list-panel" class="hidden"></div>
        </div>
      </div>

      <div class="model-hint" id="model-hint-text">🖱 ลากหมุน · Scroll ซูม · คลิกชิ้นส่วนเพื่อดูรายละเอียด</div>
    </div>

    <!-- Part Info Panel -->
    <div id="part-info-panel" class="hidden">
      <div class="part-info-inner">
        <button id="part-info-close" class="part-close-btn">✕</button>
        <div class="part-info-header">
          <h4 id="part-name"></h4>
          <span id="part-name-en"></span>
        </div>
        <p id="part-desc"></p>
        <p id="part-desc-en" class="part-desc-en"></p>
      </div>
    </div>

    <div class="article-content-area" id="article-content"></div>

    <div class="sources-section">
      <h4>แหล่งข้อมูล</h4>
      <div id="article-sources"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="js/data.js"></script>
<script src="js/models3d.js"></script>
<script src="js/app.js"></script>
</body>
</html>
